spring:
  application:
    name: PickYouth

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pickyouth}
    username: ${DB_USERNAME:pickyouth}
    password: ${DB_PASSWORD:pickyouth}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    job:
      enabled: false # @Scheduled로 직접 트리거, 앱 기동 시 자동 실행 방지
    jdbc:
      initialize-schema: always

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-prod-env}
  access-token-expiration-ms: 3600000       # 1시간
  refresh-token-expiration-ms: 1209600000   # 14일

youthcenter:
  base-url: https://www.youthcenter.go.kr/go/ythip/getPlcy
  api-key: ${YOUTHCENTER_API_KEY:}
