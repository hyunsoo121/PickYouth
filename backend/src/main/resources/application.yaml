spring:
  application:
    name: PickYouth

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pickyouth}
    username: ${DB_USERNAME:pickyouth}
    password: ${DB_PASSWORD:pickyouth}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    job:
      enabled: false # @Scheduled로 직접 트리거, 앱 기동 시 자동 실행 방지
    # Spring Batch 6(Boot 4)의 DefaultBatchConfiguration은 기본적으로 인메모리
    # ResourcelessJobRepository를 사용한다 (spring.batch.jdbc.* 프로퍼티 자체가 사라짐).
    # 우리 배치는 upsert 기반 멱등 작업이라 Job 실행 이력이 재시작 간 보존되지 않아도
    # 문제없어 당장은 기본값(인메모리)을 그대로 사용한다. 추후 Job 이력 조회/재시작이
    # 필요해지면 JdbcJobRepositoryFactoryBean으로 바꾼다.

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-prod-env}
  access-token-expiration-ms: 3600000       # 1시간
  refresh-token-expiration-ms: 1209600000   # 14일

youthcenter:
  base-url: https://www.youthcenter.go.kr/go/ythip/getPlcy
  api-key: ${YOUTHCENTER_API_KEY:}
